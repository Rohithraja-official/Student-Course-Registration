<!DOCTYPE html>
<html>
<head>
    <title>Students</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-4">
    <h2 class="mb-3">Student Management</h2>

    <!-- Add Student Form -->
    <div class="card p-3">
        <h4>Add Student</h4>
        <form id="studentForm">
            <div class="row">
                <div class="col-md-4">
                    <input id="name" class="form-control" placeholder="Name">
                </div>
                <div class="col-md-4">
                    <input id="email" class="form-control" placeholder="Email">
                </div>
                <div class="col-md-4">
                    <button class="btn btn-primary w-100">Add</button>
                </div>
            </div>
        </form>
    </div>

    <!-- Student List -->
    <div class="card p-3 mt-4">
        <h4>Students List</h4>
        <table class="table table-striped mt-2" id="studentTable">
            <thead class="table-dark">
                <tr><th>ID</th><th>Name</th><th>Email</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
function loadStudents() {
    // FIX 1: Change API path from "/students" to "/api/students"
    fetch("/api/students")
    .then(res => res.json())
    .then(data => {
        let tbody = document.querySelector("#studentTable tbody");
        tbody.innerHTML = "";
        data.forEach(s => {
            tbody.innerHTML += `
                <tr>
                    <td>${s.studentId}</td>
                    <td>${s.name}</td>
                    <td>${s.email}</td>
                </tr>`;
        });
    });
}

document.getElementById("studentForm").addEventListener("submit", e => {
    e.preventDefault();

    let student = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value
        // Note: Missing 'department' field for Student entity, assuming it's null/defaulted by backend
    };

    fetch("/api/students", { // FIX 3: Change API path from "/students" to "/api/students"
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(student)
    }).then(() => loadStudents()); // Added () to call loadStudents after POST
});

loadStudents();
</script>

</body>
</html>
