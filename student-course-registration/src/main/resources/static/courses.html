<!DOCTYPE html>
<html>
<head>
    <title>Courses</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-4">
    <h2 class="mb-3">Course Management</h2>

    <!-- Add Course Form -->
    <div class="card p-3">
        <h4>Add Course</h4>
        <form id="courseForm">
            <div class="row">
                <div class="col-md-4">
                    <input id="title" class="form-control" placeholder="Course Title">
                </div>
                <div class="col-md-4">
                    <input id="instructor" class="form-control" placeholder="Instructor Name">
                </div>
                <div class="col-md-4">
                    <button class="btn btn-primary w-100">Add</button>
                </div>
            </div>
        </form>
    </div>

    <!-- Course List -->
    <div class="card p-3 mt-4">
        <h4>Courses List</h4>
        <table class="table table-striped mt-2" id="courseTable">
            <thead class="table-dark">
                <tr><th>ID</th><th>Title</th><th>Instructor</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
function loadCourses() {
    // FIX 1: Change API path from "/courses" to "/api/courses"
    fetch("/api/courses")
    .then(res => res.json())
    .then(data => {
        let tbody = document.querySelector("#courseTable tbody");
        tbody.innerHTML = "";
        data.forEach(c => {
            tbody.innerHTML += `
                <tr>
                    <td>${c.courseId}</td>
                    <td>${c.title}</td>
                    <td>${c.instructor}</td>
                </tr>`;
        });
    });
}

document.getElementById("courseForm").addEventListener("submit", e => {
    e.preventDefault();

    let course = {
        title: document.getElementById("title").value,
        instructor: document.getElementById("instructor").value
        // Note: Missing 'description' and 'credits' fields for Course entity, assuming it's null/defaulted by backend
    };

    fetch("/api/courses", { // FIX 3: Change API path from "/courses" to "/api/courses"
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(course)
    }).then(loadCourses);
});

loadCourses();
</script>

</body>
</html>
